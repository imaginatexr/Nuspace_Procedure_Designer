<html>
  <head>
    <title>401 Authorization Required</title>
    <style>
      /* Set the body to take up the full viewport height and remove any default margin */
      body {
        background-color: white;
        margin: 0;
        height: 100vh; /* 100% of the viewport height */
        display: flex;
        justify-content: center; /* Horizontally center */
        align-items: center; /* Vertically center */
        font-family: Arial, sans-serif; /* Optional: setting a font */
      }

      /* Style the content inside the div */
      .content {
        text-align: center;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 8px;
        background-color: #f9f9f9;
      }

      /* Optional: style for the heading */
      h1 {
        font-size: 2em;
        color: #d9534f;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>401 Authorization Required</h1>
      <p>Please authenticate to access this resource.</p>
    </div>
  </body>
</html>
